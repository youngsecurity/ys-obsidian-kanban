name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Regression tests
        run: bun test

      - name: Validate Young Security release version
        run: npm run check:release-version

      - name: Targeted lint
        run: npx eslint src/components/MarkdownRenderer/MarkdownRenderer.tsx src/components/MarkdownRenderer/markdownVisibility.ts

      - name: Production build
        run: npm run build
